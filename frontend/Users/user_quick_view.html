<div class="modal-overlay" id="userQuickViewModal">
    <div class="modal-card" style="max-width:400px;padding:0;overflow:hidden;border-radius:16px;position:relative;">
        <div style="height:80px;background:linear-gradient(135deg,#1C3353 0%,#3a7a5e 100%);"></div>
        <button type="button" id="userQuickViewClose" style="position:absolute;top:12px;right:16px;background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:50%;width:30px;height:30px;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;">&times;</button>
        <div style="padding:0 24px 24px;margin-top:-40px;text-align:center;">
            <div id="uqvAvatar" style="width:80px;height:80px;border-radius:50%;margin:0 auto 12px;border:3px solid #F6F0D6;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.15);"></div>
            <h3 id="uqvName" style="margin:0 0 2px;font-size:1.2rem;color:#1C3353;"></h3>
            <p id="uqvDept" style="margin:0 0 4px;font-size:0.85rem;color:#5a7a8c;"></p>
            <p id="uqvCms" style="margin:0 0 12px;font-size:0.75rem;color:#8aa99b;font-family:monospace;display:inline-block;background:#f0f3f1;padding:2px 10px;border-radius:6px;"></p>
            <div style="display:flex;gap:16px;justify-content:center;margin-bottom:16px;">
                <div style="text-align:center;"><div id="uqvConn" style="font-size:1.1rem;font-weight:800;color:#1C3353;"></div><div style="font-size:0.7rem;color:#8aa99b;">Connections</div></div>
                <div style="text-align:center;"><div id="uqvComm" style="font-size:1.1rem;font-weight:800;color:#1C3353;"></div><div style="font-size:0.7rem;color:#8aa99b;">Communities</div></div>
                <div style="text-align:center;"><div id="uqvProj" style="font-size:1.1rem;font-weight:800;color:#1C3353;"></div><div style="font-size:0.7rem;color:#8aa99b;">Projects</div></div>
            </div>
            <div id="uqvBio" style="font-size:0.85rem;color:#3a5a6e;line-height:1.6;margin-bottom:12px;text-align:left;"></div>
            <div id="uqvSkills" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:16px;"></div>
            <form method="POST" action="{% url 'dashboard' %}" style="margin:0;">
                {% csrf_token %}
                <input type="hidden" name="action" value="connect">
                <input type="hidden" name="user_id" id="uqvUserId" value="">
                <button type="submit" class="edit-profile-btn" style="width:100%;padding:10px;font-size:0.9rem;"><i class="fas fa-user-plus"></i> Connect</button>
            </form>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var modal = document.getElementById('userQuickViewModal');
    var closeBtn = document.getElementById('userQuickViewClose');
    if (closeBtn) {
        closeBtn.addEventListener('click', function() { modal.classList.remove('show'); });
    }
    if (modal) {
        modal.addEventListener('click', function(e) {
            if (e.target === modal) modal.classList.remove('show');
        });
    }
});

function showUserQuickView(userId) {
    var modal = document.getElementById('userQuickViewModal');
    fetch('/api/user/' + userId + '/')
        .then(function(r) { return r.json(); })
        .then(function(d) {
            document.getElementById('uqvName').textContent = d.name;
            document.getElementById('uqvDept').textContent = (d.role_slug === 'alumni' ? 'Alumni - ' : '') + d.department + (d.semester ? ' - Sem ' + d.semester : '');
            document.getElementById('uqvCms').textContent = 'CMS: ' + d.cms;
            document.getElementById('uqvConn').textContent = d.connections_count;
            document.getElementById('uqvComm').textContent = d.communities_count;
            document.getElementById('uqvProj').textContent = d.projects_count;
            document.getElementById('uqvBio').textContent = d.bio || 'No bio yet.';
            document.getElementById('uqvUserId').value = d.id;

            var avatarEl = document.getElementById('uqvAvatar');
            if (d.profile_pic) {
                avatarEl.innerHTML = '<img src="' + escHtml(d.profile_pic) + '" alt="" style="width:100%;height:100%;object-fit:cover;">';
            } else {
                var initials = d.name.split(' ').map(function(s) { return s[0]; }).join('').substring(0, 2).toUpperCase();
                avatarEl.innerHTML = '<div style="width:100%;height:100%;background:linear-gradient(135deg,#1C3353,#3a7a5e);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.5rem;">' + escHtml(initials) + '</div>';
            }

            var skillsEl = document.getElementById('uqvSkills');
            skillsEl.innerHTML = '';
            if (d.skills && d.skills.length) {
                d.skills.forEach(function(s) {
                    var tag = document.createElement('span');
                    tag.className = 'skill-tag';
                    tag.textContent = s;
                    tag.style.cssText = 'padding:4px 12px;font-size:0.75rem;';
                    skillsEl.appendChild(tag);
                });
            } else {
                skillsEl.innerHTML = '<span style="font-size:0.8rem;color:#8aa99b;">No skills listed</span>';
            }

            modal.classList.add('show');
        });
}
</script>
