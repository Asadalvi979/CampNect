<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:#f4f7f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7f6;padding:40px 0;">
        <tr>
            <td align="center">
                <table width="560" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:12px;overflow:hidden;">
                    <tr>
                        <td style="background:#1C3353;padding:30px 40px;text-align:center;">
                            <h1 style="margin:0;color:#F6F0D6;font-size:1.5rem;">New Mentorship Request</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px 40px;">
                            <p style="margin:0 0 8px;color:#1C3353;font-size:0.9rem;">Hi <strong>{{ alumni_name }}</strong>,</p>
                            <p style="margin:0 0 20px;color:#1C3353;font-size:0.9rem;"><strong>{{ student_name }}</strong> has sent you a mentorship request.</p>
                            <table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;border-radius:8px;padding:16px 20px;margin-bottom:24px;">
                                <tr>
                                    <td style="padding:4px 0;">
                                        <span style="color:#8aa99b;font-size:0.8rem;">Subject</span>
                                        <p style="margin:2px 0 0;color:#1C3353;font-size:0.9rem;">{{ subject }}</p>
                                    </td>
                                </tr>
                                <tr>
                                    <td style="padding:4px 0;">
                                        <span style="color:#8aa99b;font-size:0.8rem;">Reason</span>
                                        <p style="margin:2px 0 0;color:#1C3353;font-size:0.9rem;">{{ reason }}</p>
                                    </td>
                                </tr>
                            </table>
                            <a href="{{ dashboard_url }}" style="display:inline-block;background:#1C3353;color:#F6F0D6;text-decoration:none;padding:12px 28px;border-radius:8px;font-size:0.9rem;font-weight:600;">View Request</a>
                        </td>
                    </tr>
                    <tr>
                        <td style="background:#f4f7f6;padding:16px 40px;text-align:center;">
                            <p style="margin:0;color:#8aa99b;font-size:0.75rem;">CampNect &mdash; Riphah Sahiwal</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
