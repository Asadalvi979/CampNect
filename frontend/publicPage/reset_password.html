{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'images/chatgpt-image.png' %}">
    <title>CampNect - Reset Password</title>
    <link rel="stylesheet" href="{% static 'assets/css/theme.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/register.css' %}">
    <style>
        .otp-inputs {
            display: flex; gap: 10px; justify-content: center; margin: 1.5rem 0;
        }
        .otp-inputs input {
            width: 50px; height: 56px; text-align: center; font-size: 1.4rem;
            font-weight: 700; border: 2px solid #e0e8e4; border-radius: 10px;
            outline: none; transition: border-color 0.15s; font-family: inherit;
        }
        .otp-inputs input:focus {
            border-color: #1C3353; box-shadow: 0 0 0 3px rgba(28,51,83,0.1);
        }
        .timer { text-align: center; font-size: 2rem; font-weight: 700; color: #1C3353; margin-bottom: 0.5rem; }
        .timer.expired { color: #cc4444; }
        .timer-label { text-align: center; font-size: 0.82rem; color: #8aa99b; margin-bottom: 1.2rem; }
        .divider { border: none; border-top: 1px solid #e8ece8; margin: 1.5rem 0; }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card" style="max-width:440px;">
            <div class="logo-wrapper">
                <a href="{% url 'index' %}" style="text-decoration: none; color: inherit;"><h1 class="logo">CampNect</h1></a>
                <p class="tagline">Connect • Collaborate • Grow</p>
            </div>

            <h2 class="register-title">Reset Password</h2>
            <p class="subtitle">Enter the OTP sent to <strong>{{ email }}</strong></p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <div class="timer" id="timer">--:--</div>
            <div class="timer-label">Code expires in</div>

            <form method="POST" action="{% url 'reset_password' %}" id="resetForm">
                {% csrf_token %}
                <div class="otp-inputs" id="otpInputs">
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required autofocus>
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" required>
                </div>
                <input type="hidden" name="code" id="otpHidden">

                <hr class="divider">

                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" name="new_password" placeholder="At least 6 characters" required minlength="6">
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" placeholder="Re-enter new password" required minlength="6">
                </div>

                <button type="submit" class="register-btn" id="submitBtn">Reset Password</button>
            </form>

            <div style="text-align:center;margin-top:0.8rem;">
                <form method="POST" action="{% url 'reset_password' %}" style="display:inline;">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="resend_otp">
                    <button type="submit" style="background:none;border:none;color:#1e6f5c;font-size:0.85rem;font-weight:600;cursor:pointer;text-decoration:underline;padding:0;font-family:inherit;">Resend OTP</button>
                </form>
            </div>

            <div class="login-redirect">
                <p><a href="{% url 'login' %}">← Back to Login</a></p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var inputs = document.querySelectorAll('#otpInputs input');
            var hidden = document.getElementById('otpHidden');
            var form = document.getElementById('resetForm');
            var timerEl = document.getElementById('timer');
            var submitBtn = document.getElementById('submitBtn');

            var totalSeconds = {{ remaining_seconds|default:0 }};
            var expired = false;

            function updateTimer() {
                if (expired) return;
                var m = Math.floor(totalSeconds / 60);
                var s = totalSeconds % 60;
                timerEl.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
                if (totalSeconds <= 0) {
                    expired = true;
                    timerEl.classList.add('expired');
                    timerEl.textContent = 'Expired';
                    submitBtn.disabled = true;
                    submitBtn.style.opacity = '0.5';
                    submitBtn.textContent = 'Expired - Request Again';
                } else {
                    totalSeconds--;
                }
            }
            updateTimer();
            setInterval(updateTimer, 1000);

            inputs.forEach(function(inp, idx) {
                inp.addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 1);
                    if (this.value && idx < inputs.length - 1) inputs[idx + 1].focus();
                });
                inp.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && !this.value && idx > 0) inputs[idx - 1].focus();
                });
            });

            form.addEventListener('submit', function() {
                var code = '';
                inputs.forEach(function(inp) { code += inp.value; });
                hidden.value = code;
                if (code.length !== 6) {
                    alert('Please enter the full 6-digit code.');
                    return false;
                }
            });
        })();
    </script>
</body>
</html>
