{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'images/chatgpt-image.png' %}">
    <title>CampNect - Forgot Password</title>
    <link rel="stylesheet" href="{% static 'assets/css/theme.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/register.css' %}">
</head>
<body>
    <div class="register-container">
        <div class="register-card" style="max-width:420px;">
            <div class="logo-wrapper">
                <a href="{% url 'index' %}" style="text-decoration: none; color: inherit;"><h1 class="logo">CampNect</h1></a>
                <p class="tagline">Connect • Collaborate • Grow</p>
            </div>

            <h2 class="register-title">Forgot Password</h2>
            <p class="subtitle">Enter your CMS or email to receive an OTP</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'forgot_password' %}">
                {% csrf_token %}
                <div class="input-group">
                    <label>CMS Number or Email</label>
                    <input type="text" name="cms_or_email" placeholder="e.g. 12345 or email@riphah.edu.pk" required>
                </div>

                <button type="submit" class="register-btn">Send OTP</button>

                <div class="login-redirect">
                    <p><a href="{% url 'login' %}">← Back to Login</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
